name: Build Mac App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller keyboard pyautogui

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile \
          --windowed \
          --name "TelegramParser" \
          --clean \
          --noconfirm \
          parser.py

    - name: Prepare App Bundle
      run: |
        cd dist
        zip -r TelegramParser_Mac.zip TelegramParser.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TelegramParser-Mac
        path: dist/TelegramParser_Mac.zip
